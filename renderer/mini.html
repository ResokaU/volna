<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VOLNA mini</title>
<style>
*{box-sizing:border-box;margin:0;user-select:none}
body{background:#0a0a12;color:#eee;font-family:'Golos Text','Segoe UI',sans-serif;
overflow:hidden;height:100vh;display:flex;align-items:center;gap:14px;padding:16px 44px 16px 16px;
-webkit-app-region:drag;
background-image:radial-gradient(400px 300px at 50% -20%,rgba(177,74,255,.25),transparent),
radial-gradient(300px 200px at 100% 120%,rgba(214,255,58,.14),transparent)}
body::before{content:'';position:fixed;inset:-40px;background:var(--amb,none) center/cover no-repeat;
filter:blur(46px) saturate(1.7);opacity:.28;z-index:0;pointer-events:none}
#cov{width:76px;height:76px;border-radius:16px;object-fit:cover;flex-shrink:0;
background:#181820;z-index:1;box-shadow:0 10px 30px -8px rgba(0,0,0,.7)}
.info{flex:1;min-width:0;z-index:1}
#t{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#a{font-size:11px;color:#9a9ab0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 6px}
#fft{width:100%;height:22px;opacity:.85}
#p{height:4px;background:rgba(255,255,255,.13);border-radius:9px;overflow:hidden}
#pf{height:100%;background:linear-gradient(90deg,#b14aff,#ff3d7f,#d6ff3a);border-radius:9px;width:0%}
.row{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag;z-index:1}
button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#eee;
width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:15px;
transition:transform .1s,background .15s;-webkit-tap-highlight-color:transparent;font-family:inherit}
button:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
button:active{transform:scale(.92)}
#pl{width:50px;height:50px;font-size:17px;background:linear-gradient(135deg,#b14aff,#ff3d7f);
border:none;color:#fff;box-shadow:0 6px 20px -6px rgba(177,74,255,.7)}
#pl:hover{filter:brightness(1.15)}
#close{position:fixed;top:6px;right:6px;width:24px;height:24px;border-radius:8px;
font-size:11px;opacity:.35;border:none;background:transparent;-webkit-app-region:no-drag}
#close:hover{background:#ff3d55;color:#fff;opacity:1;transform:none}
</style>
</head>
<body>
<img id="cov" src="" alt="">
<div class="info">
  <div id="t">VOLNA</div>
  <div id="a">мини-плеер</div>
  <canvas id="fft" width="180" height="22"></canvas>
  <div id="p"><div id="pf"></div></div>
</div>
<div class="row">
  <button onclick="window.mini.action('prev')" title="Назад">⏮</button>
  <button id="pl" onclick="window.mini.action('toggle')" title="Play/Pause">▶</button>
  <button onclick="window.mini.action('next')" title="Вперёд">⏭</button>
  <button id="like" onclick="window.mini.action('like')" title="Лайк">🤍</button>
</div>
<button id="close" onclick="window.mini.action('close')" title="Закрыть">✕</button>
<script>
window.mini.sync(d => {
  if (!d) return;
  document.getElementById('t').textContent = d.title || 'VOLNA';
  document.getElementById('a').textContent = d.artist || '';
  if (d.art) document.getElementById('cov').src = d.art;
  document.getElementById('pl').textContent = d.isPlaying ? '⏸' : '▶';
  if (d.dur) document.getElementById('pf').style.width = Math.min(100, d.pos / d.dur * 100) + '%';
  document.getElementById('like').textContent = d.liked ? '❤️' : '🤍';
  document.body.style.setProperty('--amb', d.art ? 'url(' + d.art + ')' : 'none');
});
const fftC = document.getElementById('fft'), fftX = fftC.getContext('2d');
let bands = new Array(8).fill(0);
window.mini.onFft(b => { bands = b; });
(function drawFft() {
  requestAnimationFrame(drawFft);
  fftX.clearRect(0, 0, fftC.width, fftC.height);
  const bw = fftC.width / 8;
  for (let i = 0; i < 8; i++) {
    const h = Math.max(2, (bands[i] || 0) / 100 * fftC.height);
    fftX.fillStyle = 'rgba(177,74,255,.85)';
    fftX.fillRect(i * bw + 2, fftC.height - h, bw - 4, h);
  }
})();
</script>
</body>
</html>
